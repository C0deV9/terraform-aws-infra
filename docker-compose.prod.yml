version: '3.9'

services:
  backend:
    image: ${DOCKERHUB_USERNAME}/members-backend:latest
    container_name: members-backend-prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
    networks:
      - members-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/members-frontend:latest
    container_name: members-frontend-prod
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://<EC2-PUBLIC-IP>:5000
    networks:
      - members-network

networks:
  members-network:
    driver: bridge
