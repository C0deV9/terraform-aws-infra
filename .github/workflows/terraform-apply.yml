name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}
  TF_BACKEND_TABLE: ${{ secrets.TF_BACKEND_TABLE }}

jobs:
  terraform_apply:
    name: Terraform Init, Plan, and Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.7

      # Step 1 — Attempt to unlock stale Terraform state (safe cleanup)
      - name: Force unlock previous Terraform lock (if exists)
        continue-on-error: true
        run: |
          cd terraform
          echo "Checking for existing state lock..."
          terraform force-unlock -force $(terraform show -json | jq -r '.values.root_module.resources[]?.values.id?' | head -n 1) || echo "No lock found or force-unlock skipped."

      # Step 2 — Initialize Terraform backend
      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_BACKEND_TABLE"

      # Step 3 — Plan changes
      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -lock-timeout=60s -out=tfplan

      # Step 4 — Apply infrastructure
      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -lock-timeout=60s -auto-approve tfplan

      # Step 5 — Get EC2 public IP
      - name: Get EC2 Public IP
        id: get_ip
        run: |
          cd terraform
          terraform output -raw ec2_public_ip > ec2_ip.txt
          echo "EC2_HOST=$(cat ec2_ip.txt)" >> $GITHUB_ENV
          echo "✅ EC2 public IP: $(cat ec2_ip.txt)"

      # Step 6 — Trigger the next workflow automatically
      - name: Trigger Update EC2 Secret Workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: "Update EC2 Host Secret and Trigger CI/CD"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
