name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}
  TF_BACKEND_TABLE: ${{ secrets.TF_BACKEND_TABLE }}

jobs:
  terraform_apply:
    name: Terraform Init, Plan, and Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.7

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_BACKEND_TABLE"

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan

      - name: Get EC2 Public IP
        id: get_ip
        run: |
          cd terraform
          terraform output -raw ec2_public_ip > ec2_ip.txt
          echo "EC2_HOST=$(cat ec2_ip.txt)" >> $GITHUB_ENV
          echo "✅ EC2 public IP: $(cat ec2_ip.txt)"

      - name: Trigger Update EC2 Secret Workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: "Update EC2 Host Secret and Trigger CI/CD"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
