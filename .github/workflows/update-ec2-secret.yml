name: Update EC2 Host Secret

on:
  workflow_dispatch:

jobs:
  update_secret:
    name: Update GitHub Secret EC2_HOST from Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      id-token: write
      secrets: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Get EC2 Public DNS
        id: get_ec2
        run: |
          EC2_HOST=$(terraform -chdir=terraform output -raw ec2_host)
          echo "EC2_HOST=$EC2_HOST" >> $GITHUB_ENV

      - name: Update GitHub Secret EC2_HOST
        uses: gliech/create-github-secret-action@v1
        with:
          name: EC2_HOST
          value: ${{ env.EC2_HOST }}
          token: ${{ secrets.GITHUB_TOKEN }}
