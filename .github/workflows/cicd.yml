name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/members-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/members-frontend

jobs:
  # 1. Test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Backend Tests
        run: |
          cd members-curd/backend
          npm ci
          npm test || echo "No backend tests"

      - name: Run Frontend Tests
        run: |
          cd members-curd/frontend
          npm ci
          npm test || echo "No frontend tests"

  # 2. Build & Push Docker Images
  build_and_push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          cd members-curd/backend
          docker build -t $BACKEND_IMAGE:latest .
          docker push $BACKEND_IMAGE:latest

      - name: Build & Push Frontend Image
        run: |
          cd members-curd/frontend
          docker build -t $FRONTEND_IMAGE:latest .
          docker push $FRONTEND_IMAGE:latest

  # 3. Deploy (shared logic for EC2)
  deploy:
    name: Deploy to EC2
    needs: build_and_push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env_name: [staging, production]
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2key.pem
          chmod 600 ec2key.pem

      - name: Deploy on EC2 - ${{ matrix.env_name }}
        run: |
          FILE=docker-compose.${{ matrix.env_name }}.yml
          scp -i ec2key.pem -o StrictHostKeyChecking=no $FILE ubuntu@$EC2_HOST:/home/ubuntu/
          ssh -i ec2key.pem -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "
            set -e
            sudo apt-get update -y
            sudo apt-get install -y ca-certificates curl gnupg
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            echo \
              'deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
              https://download.docker.com/linux/ubuntu \$(. /etc/os-release && echo \$VERSION_CODENAME) stable' | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update -y
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            sudo systemctl enable docker || true
            sudo systemctl start docker || true
            sudo usermod -aG docker ubuntu
            docker pull $BACKEND_IMAGE:latest
            docker pull $FRONTEND_IMAGE:latest
            docker compose -f $FILE up -d --force-recreate
          "

  # 4. Manual approval before production
  approve_production:
    name: Manual Approval for Production
    needs: deploy
    runs-on: ubuntu-latest
    if: contains(needs.deploy.outputs.matrix, 'production')
    environment:
      name: production
    steps:
      - run: echo "✅ Waiting for manual approval before deploying to production"

  # 5. Notify on failure
  notify_failure:
    if: failure()
    needs: [test, build_and_push, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚨 CI/CD Pipeline Failed - ${{ github.repository }}"
          body: "Pipeline failed on job ${{ github.job }}. Check logs for details."
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "GitHub Actions <${{ secrets.EMAIL_USER }}>"

